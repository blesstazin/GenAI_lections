name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest coverage pytest-cov
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Download and extract Ollama manually
      run: |
        if [ "${{ runner.arch }}" = "X64" ]; then ARCH="amd64"; else ARCH="arm64"; fi
        curl -fsSL "https://ollama.com/download/ollama-linux-${ARCH}.tar.zst" -o ollama.tar.zst
        mkdir -p .ollama-install
        tar -C .ollama-install --zstd -xf ollama.tar.zst
        rm ollama.tar.zst
        echo "$(pwd)/.ollama-install/bin" >> $GITHUB_PATH

    - name: Start Ollama Service and Pull Model
      run: |
        export OLLAMA_NUM_PARALLEL=1
        export OLLAMA_MAX_LOADED_MODELS=1
        ollama serve > ollama.log 2>&1 &
        sleep 5
        ollama pull qwen3.5:0.8b

    - name: Test with coverage
      working-directory: ./3_1_LLM_agent
      env:
        PYTHONPATH: .
      run: |
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install coverage pytest pytest-cov pypdf pdfplumber requests
        
        coverage run -m unittest discover -s tests -p "test_*.py" -v
        coverage report -m
        coverage json

    - name: Extract coverage percent
      working-directory: ./3_1_LLM_agent
      run: |
        TOTAL=$(python -c "import json; print(json.load(open('coverage.json'))['totals']['percent_covered_display'])")
        echo "total=$TOTAL" >> $GITHUB_ENV
        echo "Coverage is ${TOTAL}%"

    - name: Create Coverage Badge
      uses: schneegans/dynamic-badges-action@v1.7.0
      with:
        auth: ${{ secrets.GIST_SECRET }}
        gistID: c8dc3087e86f23873b54d5084269c7b7
        filename: coverage.json
        label: coverage
        message: ${{ env.total }}%
        valColorRange: ${{ env.total }}
        minColorRange: 50
        maxColorRange: 90
